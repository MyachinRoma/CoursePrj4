services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h db -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
              python manage.py migrate django_celery_beat &&
              python manage.py create_weekdays &&
              python manage.py collectstatic --noinput &&
              gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 120"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
    ports:
      - "80:80"
    depends_on:
      - web
    env_file:
      - .env


  redis:
    image: redis:latest
    volumes:
      - redis_data:/data
    env_file:
      - .env

  celery:
    build: .
    command: bash -c "celery -A config worker --loglevel=info --pool=solo"
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
      - web
    env_file:
      - .env

  celery-beat:
    build: .
    command: bash -c "celery -A config beat -l info"
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
      - web
    env_file:
      - .env

volumes:
  postgres_data:
  static_volume:
  redis_data:
