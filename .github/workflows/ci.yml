name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: habits_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Clean pip cache
        run: |
          pip cache purge
          rm -rf ~/.cache/pip

      - name: Run Flake8
        run: flake8 .

      - name: Prepare env
        run: |
          cp .env.sample .env
          {
            echo "NAME=habits_db"
            echo "USER=postgres"
            echo "PASSWORD=postgres"
            echo "HOST=localhost"
            echo "PORT=5432"
            echo "DEBUG=false"
            echo "SECRET_KEY=test-secret"
            echo "ALLOWED_HOSTS=localhost,127.0.0.1"
          } >> .env

      - name: Django checks & migrations
        run: |
          poetry run python manage.py collectstatic --noinput || true
          poetry run python manage.py migrate

      - name: Run tests
        run: poetry run pytest -q
